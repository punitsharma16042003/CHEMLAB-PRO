<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemLab Pro LIMS - Initializing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            -webkit-user-select: none;
        }
        body {
            background: transparent;
            width: 460px;
            height: 310px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .splash-card {
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0px;
            width: 460px;
            height: 310px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            position: relative;
        }
        .logo-container {
            width: 120px;
            height: 120px;
            margin-bottom: 18px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(129, 75, 246, 0.5));
            animation: pulseLogo 2s infinite ease-in-out;
            z-index: 2;
        }
        .loader-circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.03);
            border-top: 3px solid #00e5ff;
            border-right: 3px solid #814bf6;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.45), inset 0 0 15px rgba(129, 75, 246, 0.35);
            z-index: 1;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00e5ff, #814bf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        p.subtitle {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }
        .loader-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .status-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            height: 16px;
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="logo-container">
            <div class="loader-circle"></div>
            <img src="logo.png" class="logo-img" alt="ChemLab Pro Logo">
        </div>
        <h1>ChemLab Pro</h1>
        <p class="subtitle">Qualitative & Quantitative LIMS</p>
        
        <div class="loader-container">
            <div class="status-text" id="status-label">Initializing LIMS environment...</div>
        </div>
    </div>

    <script>
        const statusLabel = document.getElementById('status-label');
        const statuses = [
            { time: 0, text: "Initializing water quality analytical libraries..." },
            { time: 500, text: "Connecting to local SQLite secure cache..." },
            { time: 1100, text: "Verifying calibration parameters and guidelines..." },
            { time: 1700, text: "Loading Langelier Index Saturation models..." },
            { time: 2300, text: "Optimizing scientific plotting canvases..." },
            { time: 2800, text: "Launching ChemLab Pro..." }
        ];

        statuses.forEach(status => {
            setTimeout(() => {
                statusLabel.textContent = status.text;
            }, status.time);
        });
    </script>
</body>
</html>
